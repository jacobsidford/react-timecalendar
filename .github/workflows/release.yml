name: Release

# Publishes to npm via trusted publishing (OIDC), no token needed.
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   repository jacobsidford/react-timecalendar, workflow release.yml
# Trigger: push a tag matching v*.*.* that equals package.json version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check tag matches package version
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package ${v}"; exit 1; }
      - run: npm publish --access public --provenance
