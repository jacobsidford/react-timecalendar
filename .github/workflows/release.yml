name: Release

# Publishes to npm via trusted publishing (OIDC), no token needed.
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   repository jacobsidford/react-timecalendar, workflow release.yml
# Trigger: push a tag matching v*.*.* that equals package.json version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm >= 11.5.1. npm 12 requires Node 22+, so
      # pin the 11 line. No registry-url on setup-node: it injects a placeholder
      # NODE_AUTH_TOKEN that overrides the OIDC exchange and the registry answers 404.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check tag matches package version
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package ${v}"; exit 1; }
      - run: npm publish --access public --provenance
