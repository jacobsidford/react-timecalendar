<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a8fff" />
    <link rel="manifest" href="./manifest.json" />
    <title>react-timecalendar demo</title>
    <style>
      body { margin: 0; font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #444; background: #fafafa; }
      main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-weight: 300; margin: 0 0 4px; }
      h1 a { color: #1a8fff; text-decoration: none; }
      .hint { color: #777; margin: 0 0 20px; font-size: 14px; }
      .status { margin-top: 16px; padding: 12px 16px; background: #fff; border: 1px solid #eee; font-size: 14px; }
      .status code { background: #f2f2f2; padding: 2px 6px; }

    <main id="root"></main>
    <script type="module" src="./main.tsx"></script>
